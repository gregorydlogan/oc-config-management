---

- name: Templating index reset script
  template:
    src: reset.sh
    dest: /tmp/reset.sh
    owner: opensearch
    group: opensearch
    mode: 0755
  become: true

- name: Executing index reset
  shell: /tmp/reset.sh
  become: true
  become_user: opensearch

- name: Removing index reset script
  file:
    path: /tmp/reset.sh
    state: absent
  become: true

